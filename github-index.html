<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harsha's 3D Human Model</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 50%, #3b4a5c 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas3d {
            width: 100vw;
            height: 100vh;
            display: block;
            cursor: grab;
        }

        #canvas3d:active {
            cursor: grabbing;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ecf0f1;
            z-index: 10;
            text-align: center;
        }

        .spinner {
            width: 64px;
            height: 64px;
            border: 5px solid rgba(236, 240, 241, 0.1);
            border-top: 5px solid #7a4825;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 24px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading h2 {
            font-size: 24px;
            font-weight: 300;
            margin-bottom: 8px;
            letter-spacing: 1px;
        }

        .loading p {
            font-size: 16px;
            opacity: 0.8;
            font-weight: 300;
        }

        .loading.hidden {
            display: none;
        }

        .controls-info {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(44, 62, 80, 0.9);
            color: #ecf0f1;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 14px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0.9;
            transition: all 0.3s ease;
        }

        .controls-info:hover {
            opacity: 1;
            transform: translateY(-2px);
        }

        .controls-info div {
            margin-bottom: 6px;
        }

        .controls-info div:last-child {
            margin-bottom: 0;
        }

        .watermark {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: rgba(236, 240, 241, 0.7);
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>
    <!-- Loading indicator -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <h2>Loading 3D Human Model</h2>
        <p>Preparing realistic visualization...</p>
    </div>

    <!-- Full screen 3D canvas -->
    <canvas id="canvas3d"></canvas>

    <!-- Controls info -->
    <div class="controls-info">
        <div><strong>🖱️ Drag:</strong> Rotate model</div>
        <div><strong>🔍 Scroll:</strong> Zoom in/out</div>
        <div><strong>📱 Touch:</strong> Rotate & pinch zoom</div>
    </div>

    <!-- Watermark -->
    <div class="watermark">
        Harsha's 3D Human Model
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
    <script>
        class Realistic3DHuman {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.canvas = null;
                this.humanModel = null;
                this.bodyParts = {};

                // Enhanced skin tone with realistic variations
                this.skinColor = new THREE.Color('#8b5c3c'); // Deeper, more realistic brown
                this.skinColorDark = new THREE.Color('#7a4825'); // Your original tone for shadows
                this.skinColorLight = new THREE.Color('#a67c5a'); // Lighter for highlights

                this.init();
            }

            async init() {
                try {
                    this.setupScene();
                    this.createRealisticHuman();
                    this.setupAdvancedLighting();
                    this.setupControls();
                    this.animate();
                    this.hideLoading();
                } catch (error) {
                    console.error('Failed to initialize 3D model:', error);
                    this.hideLoading();
                }
            }

            setupScene() {
                this.canvas = document.getElementById('canvas3d');
                this.scene = new THREE.Scene();

                // Enhanced background with subtle gradient
                this.scene.background = new THREE.Color(0x2c3e50);

                // Camera setup for optimal viewing
                this.camera = new THREE.PerspectiveCamera(
                    45,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000
                );
                this.camera.position.set(0, 1.7, 4);
                this.camera.lookAt(0, 1.6, 0);

                // Enhanced renderer
                this.renderer = new THREE.WebGLRenderer({
                    canvas: this.canvas,
                    antialias: true,
                    alpha: false
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.outputColorSpace = THREE.SRGBColorSpace;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;
                this.renderer.toneMappingExposure = 1.0;

                window.addEventListener('resize', () => this.handleResize());
            }

            setupAdvancedLighting() {
                // Ambient light for overall illumination
                const ambientLight = new THREE.AmbientLight(0xffffff, 0.4);
                this.scene.add(ambientLight);

                // Main key light (warm, natural lighting)
                const keyLight = new THREE.DirectionalLight(0xfff4e6, 1.2);
                keyLight.position.set(3, 5, 4);
                keyLight.castShadow = true;
                keyLight.shadow.mapSize.width = 2048;
                keyLight.shadow.mapSize.height = 2048;
                keyLight.shadow.camera.near = 0.1;
                keyLight.shadow.camera.far = 15;
                keyLight.shadow.camera.left = -4;
                keyLight.shadow.camera.right = 4;
                keyLight.shadow.camera.top = 4;
                keyLight.shadow.camera.bottom = -4;
                keyLight.shadow.bias = -0.0005;
                this.scene.add(keyLight);

                // Fill light (cooler, softer)
                const fillLight = new THREE.DirectionalLight(0xe8f4f8, 0.6);
                fillLight.position.set(-3, 3, -2);
                this.scene.add(fillLight);

                // Back rim light
                const rimLight = new THREE.DirectionalLight(0xffffff, 0.4);
                rimLight.position.set(0, 3, -5);
                this.scene.add(rimLight);

                // Environment hemisphere light
                const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x8B4513, 0.3);
                this.scene.add(hemiLight);

                // Subtle point lights for enhanced realism
                const pointLight1 = new THREE.PointLight(0xffebcd, 0.3, 8);
                pointLight1.position.set(2, 2.5, 2);
                this.scene.add(pointLight1);

                const pointLight2 = new THREE.PointLight(0xe0f6ff, 0.2, 6);
                pointLight2.position.set(-1.5, 1.8, -1);
                this.scene.add(pointLight2);
            }

            createRealisticHuman() {
                const humanGroup = new THREE.Group();

                // Enhanced skin materials with subsurface scattering effect
                const skinMaterial = new THREE.MeshPhysicalMaterial({
                    color: this.skinColor,
                    roughness: 0.3,
                    metalness: 0.0,
                    clearcoat: 0.15,
                    clearcoatRoughness: 0.05,
                    sheen: 0.6,
                    sheenRoughness: 0.4,
                    sheenColor: this.skinColorLight.clone().multiplyScalar(0.3),
                    transparent: false,
                    opacity: 1.0,
                    transmission: 0.1, // Subtle subsurface scattering
                    thickness: 0.5
                });

                // Create detailed body parts
                this.bodyParts = this.createDetailedBodyParts(skinMaterial);

                // Add all parts to the group
                Object.values(this.bodyParts).forEach(part => {
                    if (part) humanGroup.add(part);
                });

                this.humanModel = humanGroup;
                this.scene.add(humanGroup);

                // Add environment
                this.createEnvironment();
            }

            createDetailedBodyParts(skinMaterial) {
                const parts = {};

                // Head - more detailed and realistic proportions
                const headGeometry = new THREE.SphereGeometry(0.125, 32, 24);
                headGeometry.scale(1, 1.15, 0.85); // More natural head shape
                parts.head = new THREE.Mesh(headGeometry, skinMaterial);
                parts.head.position.y = 1.72;
                parts.head.castShadow = true;
                parts.head.receiveShadow = true;

                // Neck with natural taper
                const neckGeometry = new THREE.CylinderGeometry(0.052, 0.065, 0.14, 16);
                parts.neck = new THREE.Mesh(neckGeometry, skinMaterial);
                parts.neck.position.y = 1.58;
                parts.neck.castShadow = true;
                parts.neck.receiveShadow = true;

                // Enhanced torso with muscular definition
                const torsoGeometry = new THREE.CapsuleGeometry(0.16, 0.45, 12, 20);
                torsoGeometry.scale(1.3, 1, 1.1); // More athletic build
                parts.torso = new THREE.Mesh(torsoGeometry, skinMaterial);
                parts.torso.position.y = 1.25;
                parts.torso.castShadow = true;
                parts.torso.receiveShadow = true;

                // Abdomen with natural taper
                const abdomenGeometry = new THREE.CapsuleGeometry(0.125, 0.28, 12, 16);
                abdomenGeometry.scale(1.15, 1, 1);
                parts.abdomen = new THREE.Mesh(abdomenGeometry, skinMaterial);
                parts.abdomen.position.y = 0.88;
                parts.abdomen.castShadow = true;
                parts.abdomen.receiveShadow = true;

                // Pelvis with realistic proportions
                const pelvisGeometry = new THREE.CapsuleGeometry(0.14, 0.18, 12, 16);
                pelvisGeometry.scale(1.08, 1, 1.25);
                parts.pelvis = new THREE.Mesh(pelvisGeometry, skinMaterial);
                parts.pelvis.position.y = 0.68;
                parts.pelvis.castShadow = true;
                parts.pelvis.receiveShadow = true;

                // Create detailed arms and legs
                this.createDetailedArms(parts, skinMaterial);
                this.createDetailedLegs(parts, skinMaterial);

                return parts;
            }

            createDetailedArms(parts, skinMaterial) {
                // Enhanced upper arms with muscle definition
                const upperArmGeometry = new THREE.CapsuleGeometry(0.045, 0.28, 12, 16);

                parts.leftUpperArm = new THREE.Mesh(upperArmGeometry, skinMaterial);
                parts.leftUpperArm.position.set(-0.27, 1.35, 0);
                parts.leftUpperArm.rotation.z = 0.15;
                parts.leftUpperArm.castShadow = true;
                parts.leftUpperArm.receiveShadow = true;

                parts.rightUpperArm = new THREE.Mesh(upperArmGeometry, skinMaterial);
                parts.rightUpperArm.position.set(0.27, 1.35, 0);
                parts.rightUpperArm.rotation.z = -0.15;
                parts.rightUpperArm.castShadow = true;
                parts.rightUpperArm.receiveShadow = true;

                // Enhanced forearms
                const forearmGeometry = new THREE.CapsuleGeometry(0.038, 0.25, 12, 16);

                parts.leftForearm = new THREE.Mesh(forearmGeometry, skinMaterial);
                parts.leftForearm.position.set(-0.35, 1.05, 0.06);
                parts.leftForearm.rotation.z = 0.08;
                parts.leftForearm.castShadow = true;
                parts.leftForearm.receiveShadow = true;

                parts.rightForearm = new THREE.Mesh(forearmGeometry, skinMaterial);
                parts.rightForearm.position.set(0.35, 1.05, 0.06);
                parts.rightForearm.rotation.z = -0.08;
                parts.rightForearm.castShadow = true;
                parts.rightForearm.receiveShadow = true;

                // More detailed hands
                const handGeometry = new THREE.CapsuleGeometry(0.032, 0.095, 10, 14);
                handGeometry.scale(1.3, 1, 0.7);

                parts.leftHand = new THREE.Mesh(handGeometry, skinMaterial);
                parts.leftHand.position.set(-0.38, 0.85, 0.1);
                parts.leftHand.castShadow = true;
                parts.leftHand.receiveShadow = true;

                parts.rightHand = new THREE.Mesh(handGeometry, skinMaterial);
                parts.rightHand.position.set(0.38, 0.85, 0.1);
                parts.rightHand.castShadow = true;
                parts.rightHand.receiveShadow = true;
            }

            createDetailedLegs(parts, skinMaterial) {
                // Enhanced thighs with realistic proportions
                const thighGeometry = new THREE.CapsuleGeometry(0.068, 0.38, 12, 16);

                parts.leftThigh = new THREE.Mesh(thighGeometry, skinMaterial);
                parts.leftThigh.position.set(-0.085, 0.38, 0);
                parts.leftThigh.castShadow = true;
                parts.leftThigh.receiveShadow = true;

                parts.rightThigh = new THREE.Mesh(thighGeometry, skinMaterial);
                parts.rightThigh.position.set(0.085, 0.38, 0);
                parts.rightThigh.castShadow = true;
                parts.rightThigh.receiveShadow = true;

                // Enhanced calves
                const calfGeometry = new THREE.CapsuleGeometry(0.042, 0.35, 12, 16);

                parts.leftCalf = new THREE.Mesh(calfGeometry, skinMaterial);
                parts.leftCalf.position.set(-0.085, 0.02, 0);
                parts.leftCalf.castShadow = true;
                parts.leftCalf.receiveShadow = true;

                parts.rightCalf = new THREE.Mesh(calfGeometry, skinMaterial);
                parts.rightCalf.position.set(0.085, 0.02, 0);
                parts.rightCalf.castShadow = true;
                parts.rightCalf.receiveShadow = true;

                // More realistic feet
                const footGeometry = new THREE.CapsuleGeometry(0.038, 0.095, 10, 14);
                footGeometry.scale(1, 0.65, 2.2);

                parts.leftFoot = new THREE.Mesh(footGeometry, skinMaterial);
                parts.leftFoot.position.set(-0.085, -0.16, 0.05);
                parts.leftFoot.castShadow = true;
                parts.leftFoot.receiveShadow = true;

                parts.rightFoot = new THREE.Mesh(footGeometry, skinMaterial);
                parts.rightFoot.position.set(0.085, -0.16, 0.05);
                parts.rightFoot.castShadow = true;
                parts.rightFoot.receiveShadow = true;
            }

            createEnvironment() {
                // Enhanced floor with subtle reflection
                const floorGeometry = new THREE.CircleGeometry(8, 64);
                const floorMaterial = new THREE.MeshPhysicalMaterial({
                    color: 0x34495e,
                    roughness: 0.8,
                    metalness: 0.1,
                    transparent: true,
                    opacity: 0.3
                });
                const floor = new THREE.Mesh(floorGeometry, floorMaterial);
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = -0.005;
                floor.receiveShadow = true;
                this.scene.add(floor);

                // Subtle environment backdrop
                const backdropGeometry = new THREE.SphereGeometry(50, 32, 16);
                const backdropMaterial = new THREE.MeshBasicMaterial({
                    color: 0x2c3e50,
                    side: THREE.BackSide,
                    transparent: true,
                    opacity: 0.8
                });
                const backdrop = new THREE.Mesh(backdropGeometry, backdropMaterial);
                this.scene.add(backdrop);
            }

            setupControls() {
                let isMouseDown = false;
                let mouseX = 0;
                let mouseY = 0;
                this.targetRotationY = 0;
                this.targetRotationX = 0;
                this.currentZoom = 4;

                // Mouse controls
                this.canvas.addEventListener('mousedown', (event) => {
                    isMouseDown = true;
                    mouseX = event.clientX;
                    mouseY = event.clientY;
                });

                this.canvas.addEventListener('mousemove', (event) => {
                    if (!isMouseDown) return;

                    const deltaX = event.clientX - mouseX;
                    const deltaY = event.clientY - mouseY;

                    this.targetRotationY += deltaX * 0.008;
                    this.targetRotationX += deltaY * 0.008;

                    // Limit vertical rotation
                    this.targetRotationX = Math.max(-Math.PI/3, Math.min(Math.PI/3, this.targetRotationX));

                    mouseX = event.clientX;
                    mouseY = event.clientY;
                });

                this.canvas.addEventListener('mouseup', () => {
                    isMouseDown = false;
                });

                this.canvas.addEventListener('mouseleave', () => {
                    isMouseDown = false;
                });

                // Mouse wheel for zoom
                this.canvas.addEventListener('wheel', (event) => {
                    event.preventDefault();
                    const zoomDelta = event.deltaY * 0.002;
                    this.currentZoom += zoomDelta;
                    this.currentZoom = Math.max(2, Math.min(8, this.currentZoom));

                    this.camera.position.z = this.currentZoom;
                });

                // Enhanced touch controls
                this.setupAdvancedTouchControls();
            }

            setupAdvancedTouchControls() {
                let touchStartX = 0;
                let touchStartY = 0;
                let isTouching = false;
                let initialTouchDistance = 0;
                let initialZoom = this.currentZoom;

                this.canvas.addEventListener('touchstart', (event) => {
                    event.preventDefault();

                    if (event.touches.length === 1) {
                        isTouching = true;
                        const touch = event.touches[0];
                        touchStartX = touch.clientX;
                        touchStartY = touch.clientY;
                    } else if (event.touches.length === 2) {
                        // Pinch zoom
                        const touch1 = event.touches[0];
                        const touch2 = event.touches[1];
                        initialTouchDistance = Math.sqrt(
                            Math.pow(touch2.clientX - touch1.clientX, 2) +
                            Math.pow(touch2.clientY - touch1.clientY, 2)
                        );
                        initialZoom = this.currentZoom;
                        isTouching = false;
                    }
                });

                this.canvas.addEventListener('touchmove', (event) => {
                    event.preventDefault();

                    if (event.touches.length === 1 && isTouching) {
                        const touch = event.touches[0];
                        const deltaX = touch.clientX - touchStartX;
                        const deltaY = touch.clientY - touchStartY;

                        this.targetRotationY += deltaX * 0.01;
                        this.targetRotationX += deltaY * 0.01;
                        this.targetRotationX = Math.max(-Math.PI/3, Math.min(Math.PI/3, this.targetRotationX));

                        touchStartX = touch.clientX;
                        touchStartY = touch.clientY;
                    } else if (event.touches.length === 2) {
                        // Pinch zoom
                        const touch1 = event.touches[0];
                        const touch2 = event.touches[1];
                        const currentDistance = Math.sqrt(
                            Math.pow(touch2.clientX - touch1.clientX, 2) +
                            Math.pow(touch2.clientY - touch1.clientY, 2)
                        );

                        const zoomRatio = currentDistance / initialTouchDistance;
                        this.currentZoom = initialZoom / zoomRatio;
                        this.currentZoom = Math.max(2, Math.min(8, this.currentZoom));
                        this.camera.position.z = this.currentZoom;
                    }
                });

                this.canvas.addEventListener('touchend', () => {
                    isTouching = false;
                });
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                // Smooth rotation interpolation
                if (this.humanModel) {
                    this.humanModel.rotation.y += (this.targetRotationY - this.humanModel.rotation.y) * 0.08;
                    this.humanModel.rotation.x += (this.targetRotationX - this.humanModel.rotation.x) * 0.08;

                    // Enhanced breathing animation
                    const time = Date.now() * 0.0003;
                    if (this.bodyParts.torso) {
                        this.bodyParts.torso.scale.z = 1 + Math.sin(time) * 0.015;
                        this.bodyParts.abdomen.scale.z = 1 + Math.sin(time * 1.1) * 0.01;
                    }

                    // Subtle idle animation
                    const idleTime = Date.now() * 0.0001;
                    this.humanModel.position.y = Math.sin(idleTime) * 0.005;
                }

                this.renderer.render(this.scene, this.camera);
            }

            handleResize() {
                const width = window.innerWidth;
                const height = window.innerHeight;

                this.camera.aspect = width / height;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(width, height);
            }

            hideLoading() {
                const loading = document.getElementById('loading');
                loading.classList.add('hidden');
            }
        }

        // Initialize when page loads
        document.addEventListener('DOMContentLoaded', () => {
            new Realistic3DHuman();
        });
    </script>
</body>
</html>
