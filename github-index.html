<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harsha's Realistic 3D Human</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 50%, #3b4a5c 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .human-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            perspective: 1500px;
        }

        .human-container:active {
            cursor: grabbing;
        }

        .human-model {
            transform-style: preserve-3d;
            transition: transform 0.05s ease-out;
            position: relative;
            height: 550px;
            width: 250px;
            scale: 1.2;
        }

        .body-part {
            position: absolute;
            transform-style: preserve-3d;
        }

        /* Professional realistic skin shader */
        .skin {
            background:
                radial-gradient(ellipse at 30% 20%, rgba(200, 150, 120, 0.3) 0%, transparent 50%),
                radial-gradient(ellipse at 70% 80%, rgba(120, 80, 60, 0.2) 0%, transparent 50%),
                linear-gradient(145deg,
                    #a67c5a 0%,
                    #8b5c3c 20%,
                    #7a4825 40%,
                    #6d3f1f 70%,
                    #5a3318 100%);
            box-shadow:
                inset -6px -8px 20px rgba(0,0,0,0.4),
                inset 6px 6px 15px rgba(255,235,205,0.15),
                0 8px 25px rgba(0,0,0,0.3),
                0 0 40px rgba(122,72,37,0.1);
        }

        /* Ultra-realistic head with facial structure */
        .head {
            width: 85px;
            height: 110px;
            border-radius: 42px 42px 38px 38px;
            top: -55px;
            left: 82px;
            background:
                radial-gradient(ellipse at 30% 25%, rgba(200, 150, 120, 0.4) 0%, transparent 40%),
                radial-gradient(ellipse at 70% 75%, rgba(90, 60, 45, 0.3) 0%, transparent 50%),
                linear-gradient(160deg,
                    #b8845d 0%,
                    #a67c5a 15%,
                    #8b5c3c 35%,
                    #7a4825 60%,
                    #6d3f1f 85%,
                    #5a3318 100%);
            box-shadow:
                inset -8px -12px 25px rgba(0,0,0,0.35),
                inset 8px 8px 18px rgba(255,235,205,0.12),
                0 12px 30px rgba(0,0,0,0.35);
        }

        /* Add detailed facial features */
        .head::before {
            content: '';
            position: absolute;
            top: 28px;
            left: 18px;
            width: 48px;
            height: 25px;
            background:
                radial-gradient(ellipse at 20% 40%, rgba(0,0,0,0.6) 0%, transparent 25%),
                radial-gradient(ellipse at 80% 40%, rgba(0,0,0,0.6) 0%, transparent 25%),
                linear-gradient(90deg, transparent 35%, rgba(60,40,30,0.4) 45%, rgba(60,40,30,0.4) 55%, transparent 65%);
            border-radius: 12px;
        }

        /* Add nose shadow */
        .head::after {
            content: '';
            position: absolute;
            top: 45px;
            left: 37px;
            width: 10px;
            height: 20px;
            background: linear-gradient(180deg,
                rgba(0,0,0,0.15) 0%,
                rgba(0,0,0,0.25) 50%,
                rgba(0,0,0,0.1) 100%);
            border-radius: 5px;
            box-shadow: inset 2px 0 4px rgba(0,0,0,0.2);
        }

        /* Athletic neck with proper proportions */
        .neck {
            width: 50px;
            height: 55px;
            top: 55px;
            left: 100px;
            border-radius: 25px;
            background: linear-gradient(180deg,
                #a67c5a 0%,
                #8b5c3c 30%,
                #7a4825 70%,
                #6d3f1f 100%);
            box-shadow:
                inset -4px -6px 15px rgba(0,0,0,0.3),
                inset 4px 4px 10px rgba(255,235,205,0.1),
                0 4px 12px rgba(0,0,0,0.3);
        }

        /* Muscular torso with chest definition */
        .torso {
            width: 130px;
            height: 160px;
            top: 110px;
            left: 60px;
            border-radius: 25px 25px 20px 20px;
            background:
                radial-gradient(ellipse at 35% 30%, rgba(255,235,205,0.15) 0%, transparent 40%),
                radial-gradient(ellipse at 65% 30%, rgba(255,235,205,0.15) 0%, transparent 40%),
                linear-gradient(145deg,
                    #a67c5a 0%,
                    #8b5c3c 25%,
                    #7a4825 50%,
                    #6d3f1f 75%,
                    #5a3318 100%);
            box-shadow:
                inset -15px -18px 30px rgba(0,0,0,0.4),
                inset 10px 10px 20px rgba(255,235,205,0.08),
                0 15px 35px rgba(0,0,0,0.4);
            animation: breathe 5s ease-in-out infinite;
        }

        /* Chest muscle definition */
        .torso::before {
            content: '';
            position: absolute;
            top: 15px;
            left: 15px;
            width: 100px;
            height: 80px;
            background:
                radial-gradient(ellipse at 25% 25%, rgba(255,235,205,0.2) 0%, transparent 30%),
                radial-gradient(ellipse at 75% 25%, rgba(255,235,205,0.2) 0%, transparent 30%),
                linear-gradient(180deg,
                    rgba(255,235,205,0.1) 0%,
                    transparent 40%,
                    rgba(0,0,0,0.1) 100%);
            border-radius: 20px;
        }

        /* Ab definition */
        .torso::after {
            content: '';
            position: absolute;
            top: 90px;
            left: 35px;
            width: 60px;
            height: 50px;
            background:
                linear-gradient(90deg, transparent 0%, rgba(0,0,0,0.1) 20%, transparent 35%, rgba(0,0,0,0.1) 50%, transparent 65%, rgba(0,0,0,0.1) 80%, transparent 100%),
                linear-gradient(180deg, rgba(255,235,205,0.05) 0%, transparent 50%, rgba(0,0,0,0.1) 100%);
            border-radius: 15px;
        }

        /* Defined abdomen */
        .abdomen {
            width: 110px;
            height: 80px;
            top: 270px;
            left: 70px;
            border-radius: 18px;
            background: linear-gradient(145deg,
                #8b5c3c 0%,
                #7a4825 40%,
                #6d3f1f 100%);
            box-shadow:
                inset -8px -10px 20px rgba(0,0,0,0.35),
                inset 6px 6px 12px rgba(255,235,205,0.1),
                0 8px 20px rgba(0,0,0,0.3);
        }

        /* Athletic pelvis */
        .pelvis {
            width: 100px;
            height: 70px;
            top: 350px;
            left: 75px;
            border-radius: 15px;
            background: linear-gradient(145deg,
                #8b5c3c 0%,
                #7a4825 50%,
                #6d3f1f 100%);
            box-shadow:
                inset -6px -8px 16px rgba(0,0,0,0.35),
                inset 4px 4px 10px rgba(255,235,205,0.1),
                0 6px 15px rgba(0,0,0,0.3);
        }

        /* Muscular upper arms */
        .arm-left, .arm-right {
            width: 32px;
            height: 120px;
            top: 120px;
            border-radius: 16px;
            background: linear-gradient(180deg,
                #8b5c3c 0%,
                #7a4825 40%,
                #6d3f1f 100%);
            box-shadow:
                inset -4px -6px 12px rgba(0,0,0,0.35),
                inset 3px 3px 8px rgba(255,235,205,0.1),
                0 6px 15px rgba(0,0,0,0.3);
        }

        .arm-left {
            left: 20px;
            transform: rotate(8deg);
        }

        .arm-right {
            right: 20px;
            transform: rotate(-8deg);
        }

        /* Defined forearms */
        .forearm-left, .forearm-right {
            width: 28px;
            height: 110px;
            top: 235px;
            border-radius: 14px;
            background: linear-gradient(180deg,
                #7a4825 0%,
                #6d3f1f 60%,
                #5a3318 100%);
            box-shadow:
                inset -3px -5px 10px rgba(0,0,0,0.35),
                inset 3px 3px 8px rgba(255,235,205,0.1),
                0 4px 12px rgba(0,0,0,0.3);
        }

        .forearm-left {
            left: 22px;
            transform: rotate(5deg);
        }

        .forearm-right {
            right: 22px;
            transform: rotate(-5deg);
        }

        /* Realistic hands */
        .hand-left, .hand-right {
            width: 35px;
            height: 45px;
            top: 340px;
            border-radius: 17px 17px 10px 10px;
            background: linear-gradient(145deg,
                #8b5c3c 0%,
                #7a4825 50%,
                #6d3f1f 100%);
            box-shadow:
                inset -3px -4px 8px rgba(0,0,0,0.35),
                inset 2px 2px 6px rgba(255,235,205,0.1),
                0 3px 10px rgba(0,0,0,0.3);
        }

        .hand-left {
            left: 18px;
        }

        .hand-right {
            right: 18px;
        }

        /* Hand detail - finger segments */
        .hand-left::before, .hand-right::before {
            content: '';
            position: absolute;
            top: 5px;
            left: 5px;
            width: 25px;
            height: 30px;
            background:
                linear-gradient(90deg,
                    transparent 0%, rgba(0,0,0,0.1) 15%, transparent 20%,
                    transparent 30%, rgba(0,0,0,0.1) 35%, transparent 40%,
                    transparent 50%, rgba(0,0,0,0.1) 55%, transparent 60%,
                    transparent 70%, rgba(0,0,0,0.1) 75%, transparent 80%);
            border-radius: 8px;
        }

        /* Muscular thighs */
        .thigh-left, .thigh-right {
            width: 42px;
            height: 140px;
            top: 420px;
            border-radius: 21px;
            background: linear-gradient(180deg,
                #8b5c3c 0%,
                #7a4825 30%,
                #6d3f1f 70%,
                #5a3318 100%);
            box-shadow:
                inset -5px -8px 16px rgba(0,0,0,0.4),
                inset 4px 4px 10px rgba(255,235,205,0.1),
                0 8px 20px rgba(0,0,0,0.35);
        }

        .thigh-left {
            left: 75px;
        }

        .thigh-right {
            right: 75px;
        }

        /* Athletic calves */
        .calf-left, .calf-right {
            width: 35px;
            height: 120px;
            top: 560px;
            border-radius: 17px;
            background: linear-gradient(180deg,
                #7a4825 0%,
                #6d3f1f 50%,
                #5a3318 100%);
            box-shadow:
                inset -4px -6px 12px rgba(0,0,0,0.4),
                inset 3px 3px 8px rgba(255,235,205,0.1),
                0 6px 15px rgba(0,0,0,0.35);
        }

        .calf-left {
            left: 78px;
        }

        .calf-right {
            right: 78px;
        }

        /* Detailed feet */
        .foot-left, .foot-right {
            width: 60px;
            height: 25px;
            top: 680px;
            border-radius: 10px 10px 6px 25px;
            background: linear-gradient(90deg,
                #7a4825 0%,
                #6d3f1f 70%,
                #5a3318 100%);
            box-shadow:
                inset -3px -4px 8px rgba(0,0,0,0.35),
                inset 2px 2px 6px rgba(255,235,205,0.1),
                0 4px 12px rgba(0,0,0,0.4);
        }

        .foot-left {
            left: 65px;
        }

        .foot-right {
            right: 65px;
        }

        /* Enhanced breathing animation */
        @keyframes breathe {
            0%, 100% {
                transform: scale(1) scaleY(1);
            }
            50% {
                transform: scale(1.008) scaleY(1.015);
            }
        }

        /* Controls info */
        .controls-info {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(44, 62, 80, 0.95);
            color: #ecf0f1;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 14px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0.9;
            transition: all 0.3s ease;
        }

        .controls-info:hover {
            opacity: 1;
            transform: translateY(-2px);
        }

        .controls-info div {
            margin-bottom: 6px;
        }

        .controls-info div:last-child {
            margin-bottom: 0;
        }

        .watermark {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: rgba(236, 240, 241, 0.7);
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* Realistic badge */
        .realistic-badge {
            position: absolute;
            top: 30px;
            left: 30px;
            background: rgba(230, 126, 34, 0.95);
            color: white;
            padding: 10px 18px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.5s ease;
            box-shadow: 0 4px 15px rgba(230, 126, 34, 0.3);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hide scrollbars */
        body::-webkit-scrollbar {
            display: none;
        }

        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div class="human-container" id="humanContainer">
        <div class="human-model" id="humanModel">
            <!-- Realistic head with facial features -->
            <div class="body-part head skin"></div>

            <!-- Athletic neck -->
            <div class="body-part neck skin"></div>

            <!-- Muscular torso with chest definition -->
            <div class="body-part torso skin"></div>

            <!-- Defined abdomen -->
            <div class="body-part abdomen skin"></div>

            <!-- Muscular arms -->
            <div class="body-part arm-left skin"></div>
            <div class="body-part arm-right skin"></div>

            <!-- Defined forearms -->
            <div class="body-part forearm-left skin"></div>
            <div class="body-part forearm-right skin"></div>

            <!-- Realistic hands -->
            <div class="body-part hand-left skin"></div>
            <div class="body-part hand-right skin"></div>

            <!-- Athletic pelvis -->
            <div class="body-part pelvis skin"></div>

            <!-- Muscular thighs -->
            <div class="body-part thigh-left skin"></div>
            <div class="body-part thigh-right skin"></div>

            <!-- Athletic calves -->
            <div class="body-part calf-left skin"></div>
            <div class="body-part calf-right skin"></div>

            <!-- Detailed feet -->
            <div class="body-part foot-left skin"></div>
            <div class="body-part foot-right skin"></div>
        </div>
    </div>

    <!-- Realistic badge -->
    <div class="realistic-badge">
        🎯 Realistic Human Model
    </div>

    <!-- Controls info -->
    <div class="controls-info">
        <div><strong>🖱️ Drag:</strong> Rotate model</div>
        <div><strong>🔍 Scroll:</strong> Zoom in/out</div>
        <div><strong>📱 Touch:</strong> Rotate & pinch zoom</div>
    </div>

    <!-- Watermark -->
    <div class="watermark">
        Harsha's Realistic 3D Human
    </div>

    <script>
        class RealisticInstant3DHuman {
            constructor() {
                this.container = document.getElementById('humanContainer');
                this.model = document.getElementById('humanModel');
                this.isDragging = false;
                this.startX = 0;
                this.startY = 0;
                this.rotationY = 0;
                this.rotationX = 0;
                this.currentScale = 1;

                this.setupControls();
                this.addSubtleAnimations();
            }

            setupControls() {
                // Mouse events
                this.container.addEventListener('mousedown', (e) => {
                    this.isDragging = true;
                    this.startX = e.clientX;
                    this.startY = e.clientY;
                });

                document.addEventListener('mousemove', (e) => {
                    if (!this.isDragging) return;

                    const deltaX = e.clientX - this.startX;
                    const deltaY = e.clientY - this.startY;

                    this.rotationY += deltaX * 0.7;
                    this.rotationX -= deltaY * 0.5;

                    // Realistic rotation limits
                    this.rotationX = Math.max(-20, Math.min(20, this.rotationX));

                    this.updateTransform();

                    this.startX = e.clientX;
                    this.startY = e.clientY;
                });

                document.addEventListener('mouseup', () => {
                    this.isDragging = false;
                });

                // Enhanced touch controls
                this.container.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (e.touches.length === 1) {
                        this.isDragging = true;
                        this.startX = e.touches[0].clientX;
                        this.startY = e.touches[0].clientY;
                    } else if (e.touches.length === 2) {
                        this.isDragging = false;
                        this.initialPinchDistance = this.getPinchDistance(e.touches);
                        this.initialScale = this.currentScale;
                    }
                });

                document.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    if (e.touches.length === 1 && this.isDragging) {
                        const deltaX = e.touches[0].clientX - this.startX;
                        const deltaY = e.touches[0].clientY - this.startY;

                        this.rotationY += deltaX * 0.9;
                        this.rotationX -= deltaY * 0.6;
                        this.rotationX = Math.max(-20, Math.min(20, this.rotationX));

                        this.updateTransform();

                        this.startX = e.touches[0].clientX;
                        this.startY = e.touches[0].clientY;
                    } else if (e.touches.length === 2) {
                        const currentDistance = this.getPinchDistance(e.touches);
                        const scaleRatio = currentDistance / this.initialPinchDistance;
                        this.currentScale = Math.max(0.6, Math.min(2.2, this.initialScale * scaleRatio));
                        this.updateTransform();
                    }
                });

                document.addEventListener('touchend', () => {
                    this.isDragging = false;
                });

                // Smooth zoom
                this.container.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const zoomDelta = e.deltaY > 0 ? -0.08 : 0.08;
                    this.currentScale = Math.max(0.6, Math.min(2.2, this.currentScale + zoomDelta));
                    this.updateTransform();
                });
            }

            getPinchDistance(touches) {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            updateTransform() {
                this.model.style.transform = `
                    rotateY(${this.rotationY}deg)
                    rotateX(${this.rotationX}deg)
                    scale(${this.currentScale})
                `;
            }

            addSubtleAnimations() {
                // Very subtle idle sway
                setInterval(() => {
                    if (!this.isDragging) {
                        const time = Date.now() * 0.0001;
                        const subtleRotation = Math.sin(time) * 0.3;
                        const currentTransform = this.model.style.transform;
                        if (!currentTransform.includes('rotateZ')) {
                            this.model.style.transform += ` rotateZ(${subtleRotation}deg)`;
                        }
                    }
                }, 100);
            }
        }

        // Initialize immediately - realistic and instant!
        document.addEventListener('DOMContentLoaded', () => {
            new RealisticInstant3DHuman();
        });
    </script>
</body>
</html>
