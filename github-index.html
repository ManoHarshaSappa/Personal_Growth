<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harsha's Instant 3D Human</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #2c3e50 0%, #34495e 50%, #3b4a5c 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        .human-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            perspective: 1200px;
        }

        .human-container:active {
            cursor: grabbing;
        }

        .human-model {
            transform-style: preserve-3d;
            transition: transform 0.05s ease-out;
            position: relative;
            height: 600px;
            width: 200px;
        }

        .body-part {
            position: absolute;
            transform-style: preserve-3d;
            transition: all 0.3s ease;
        }

        /* Enhanced skin material with gradients and shadows */
        .skin {
            background: linear-gradient(135deg,
                #8b5c3c 0%,
                #7a4825 30%,
                #9d6b47 70%,
                #6d3f1f 100%);
            box-shadow:
                inset -8px -8px 16px rgba(0,0,0,0.3),
                inset 8px 8px 16px rgba(255,255,255,0.1),
                0 4px 12px rgba(0,0,0,0.4);
        }

        /* Head - realistic proportions and features */
        .head {
            width: 100px;
            height: 120px;
            border-radius: 50px 50px 45px 45px;
            top: -60px;
            left: 50px;
            background: linear-gradient(145deg,
                #9d6b47 0%,
                #8b5c3c 30%,
                #7a4825 60%,
                #6d3f1f 100%);
            box-shadow:
                inset -6px -10px 20px rgba(0,0,0,0.25),
                inset 6px 6px 15px rgba(255,255,255,0.08),
                0 8px 20px rgba(0,0,0,0.3);
        }

        /* Add facial features */
        .head::before {
            content: '';
            position: absolute;
            top: 35px;
            left: 25px;
            width: 50px;
            height: 35px;
            background: linear-gradient(90deg,
                rgba(0,0,0,0.2) 20%,
                transparent 25%,
                transparent 75%,
                rgba(0,0,0,0.2) 80%);
            border-radius: 8px;
        }

        /* Neck with natural taper */
        .neck {
            width: 45px;
            height: 60px;
            top: 60px;
            left: 77px;
            border-radius: 22px;
            background: linear-gradient(180deg,
                #8b5c3c 0%,
                #7a4825 50%,
                #6d3f1f 100%);
            box-shadow:
                inset -4px -4px 12px rgba(0,0,0,0.3),
                inset 4px 4px 10px rgba(255,255,255,0.1),
                0 3px 8px rgba(0,0,0,0.3);
        }

        /* Enhanced torso with muscular definition */
        .torso {
            width: 140px;
            height: 200px;
            top: 120px;
            left: 30px;
            border-radius: 25px;
            background: linear-gradient(145deg,
                #9d6b47 0%,
                #8b5c3c 20%,
                #7a4825 50%,
                #6d3f1f 80%,
                #5a3318 100%);
            box-shadow:
                inset -12px -15px 25px rgba(0,0,0,0.35),
                inset 8px 8px 18px rgba(255,255,255,0.08),
                0 10px 25px rgba(0,0,0,0.4);
            animation: breathe 4s ease-in-out infinite;
        }

        /* Add chest definition */
        .torso::before {
            content: '';
            position: absolute;
            top: 20px;
            left: 20px;
            width: 100px;
            height: 60px;
            background: linear-gradient(180deg,
                rgba(255,255,255,0.05) 0%,
                transparent 50%,
                rgba(0,0,0,0.1) 100%);
            border-radius: 15px;
        }

        /* Enhanced arms with muscle definition */
        .arm-left, .arm-right {
            width: 35px;
            height: 140px;
            top: 130px;
            border-radius: 17px;
            background: linear-gradient(180deg,
                #8b5c3c 0%,
                #7a4825 40%,
                #6d3f1f 100%);
            box-shadow:
                inset -3px -6px 12px rgba(0,0,0,0.3),
                inset 3px 3px 8px rgba(255,255,255,0.1),
                0 4px 12px rgba(0,0,0,0.3);
        }

        .arm-left {
            left: -15px;
            transform: rotate(12deg);
        }

        .arm-right {
            right: -15px;
            transform: rotate(-12deg);
        }

        /* Enhanced forearms */
        .forearm-left, .forearm-right {
            width: 32px;
            height: 120px;
            top: 260px;
            border-radius: 16px;
            background: linear-gradient(180deg,
                #7a4825 0%,
                #6d3f1f 60%,
                #5a3318 100%);
            box-shadow:
                inset -3px -5px 10px rgba(0,0,0,0.3),
                inset 3px 3px 8px rgba(255,255,255,0.1),
                0 3px 10px rgba(0,0,0,0.3);
        }

        .forearm-left {
            left: -12px;
            transform: rotate(8deg);
        }

        .forearm-right {
            right: -12px;
            transform: rotate(-8deg);
        }

        /* Enhanced hands with finger details */
        .hand-left, .hand-right {
            width: 40px;
            height: 55px;
            top: 375px;
            border-radius: 20px 20px 12px 12px;
            background: linear-gradient(145deg,
                #8b5c3c 0%,
                #7a4825 50%,
                #6d3f1f 100%);
            box-shadow:
                inset -3px -4px 8px rgba(0,0,0,0.3),
                inset 2px 2px 6px rgba(255,255,255,0.1),
                0 2px 8px rgba(0,0,0,0.3);
        }

        .hand-left {
            left: -20px;
        }

        .hand-right {
            right: -20px;
        }

        /* Add finger lines */
        .hand-left::before, .hand-right::before {
            content: '';
            position: absolute;
            top: 8px;
            left: 8px;
            width: 24px;
            height: 30px;
            background: linear-gradient(90deg,
                transparent 0%,
                rgba(0,0,0,0.1) 20%,
                transparent 25%,
                rgba(0,0,0,0.1) 45%,
                transparent 50%,
                rgba(0,0,0,0.1) 70%,
                transparent 75%,
                rgba(0,0,0,0.1) 95%,
                transparent 100%);
        }

        /* Enhanced abdomen */
        .abdomen {
            width: 120px;
            height: 100px;
            top: 320px;
            left: 40px;
            border-radius: 20px;
            background: linear-gradient(145deg,
                #8b5c3c 0%,
                #7a4825 40%,
                #6d3f1f 100%);
            box-shadow:
                inset -8px -10px 20px rgba(0,0,0,0.3),
                inset 6px 6px 12px rgba(255,255,255,0.08),
                0 6px 15px rgba(0,0,0,0.3);
        }

        /* Enhanced pelvis */
        .pelvis {
            width: 110px;
            height: 90px;
            top: 420px;
            left: 45px;
            border-radius: 18px;
            background: linear-gradient(145deg,
                #8b5c3c 0%,
                #7a4825 50%,
                #6d3f1f 100%);
            box-shadow:
                inset -6px -8px 16px rgba(0,0,0,0.3),
                inset 4px 4px 10px rgba(255,255,255,0.08),
                0 5px 12px rgba(0,0,0,0.3);
        }

        /* Enhanced thighs with muscle definition */
        .thigh-left, .thigh-right {
            width: 45px;
            height: 170px;
            top: 510px;
            border-radius: 22px;
            background: linear-gradient(180deg,
                #8b5c3c 0%,
                #7a4825 30%,
                #6d3f1f 70%,
                #5a3318 100%);
            box-shadow:
                inset -4px -8px 16px rgba(0,0,0,0.35),
                inset 4px 4px 10px rgba(255,255,255,0.08),
                0 6px 15px rgba(0,0,0,0.3);
        }

        .thigh-left {
            left: 55px;
        }

        .thigh-right {
            right: 55px;
        }

        /* Enhanced calves */
        .calf-left, .calf-right {
            width: 38px;
            height: 150px;
            top: 680px;
            border-radius: 19px;
            background: linear-gradient(180deg,
                #7a4825 0%,
                #6d3f1f 50%,
                #5a3318 100%);
            box-shadow:
                inset -3px -6px 12px rgba(0,0,0,0.35),
                inset 3px 3px 8px rgba(255,255,255,0.08),
                0 4px 12px rgba(0,0,0,0.3);
        }

        .calf-left {
            left: 58px;
        }

        .calf-right {
            right: 58px;
        }

        /* Enhanced feet with toe definition */
        .foot-left, .foot-right {
            width: 70px;
            height: 35px;
            top: 830px;
            border-radius: 12px 12px 8px 35px;
            background: linear-gradient(90deg,
                #7a4825 0%,
                #6d3f1f 70%,
                #5a3318 100%);
            box-shadow:
                inset -3px -4px 8px rgba(0,0,0,0.3),
                inset 2px 2px 6px rgba(255,255,255,0.1),
                0 3px 10px rgba(0,0,0,0.4);
        }

        .foot-left {
            left: 40px;
        }

        .foot-right {
            right: 40px;
        }

        /* Breathing animation */
        @keyframes breathe {
            0%, 100% {
                transform: scale(1) scaleY(1);
            }
            50% {
                transform: scale(1.01) scaleY(1.02);
            }
        }

        /* Controls info */
        .controls-info {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(44, 62, 80, 0.95);
            color: #ecf0f1;
            padding: 16px 20px;
            border-radius: 12px;
            font-size: 14px;
            backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            opacity: 0.9;
            transition: all 0.3s ease;
        }

        .controls-info:hover {
            opacity: 1;
            transform: translateY(-2px);
        }

        .controls-info div {
            margin-bottom: 6px;
        }

        .controls-info div:last-child {
            margin-bottom: 0;
        }

        .watermark {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: rgba(236, 240, 241, 0.7);
            font-size: 12px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        /* Instant loading message */
        .instant-badge {
            position: absolute;
            top: 30px;
            left: 30px;
            background: rgba(46, 204, 113, 0.9);
            color: white;
            padding: 8px 16px;
            border-radius: 20px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.5s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Hide scrollbars */
        body::-webkit-scrollbar {
            display: none;
        }

        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div class="human-container" id="humanContainer">
        <div class="human-model" id="humanModel">
            <!-- Head with facial features -->
            <div class="body-part head skin"></div>

            <!-- Neck -->
            <div class="body-part neck skin"></div>

            <!-- Enhanced torso with muscle definition -->
            <div class="body-part torso skin"></div>

            <!-- Enhanced abdomen -->
            <div class="body-part abdomen skin"></div>

            <!-- Arms with muscle definition -->
            <div class="body-part arm-left skin"></div>
            <div class="body-part arm-right skin"></div>

            <!-- Forearms -->
            <div class="body-part forearm-left skin"></div>
            <div class="body-part forearm-right skin"></div>

            <!-- Hands with finger details -->
            <div class="body-part hand-left skin"></div>
            <div class="body-part hand-right skin"></div>

            <!-- Pelvis -->
            <div class="body-part pelvis skin"></div>

            <!-- Thighs with muscle definition -->
            <div class="body-part thigh-left skin"></div>
            <div class="body-part thigh-right skin"></div>

            <!-- Calves -->
            <div class="body-part calf-left skin"></div>
            <div class="body-part calf-right skin"></div>

            <!-- Feet with toe definition -->
            <div class="body-part foot-left skin"></div>
            <div class="body-part foot-right skin"></div>
        </div>
    </div>

    <!-- Instant loading badge -->
    <div class="instant-badge">
        ⚡ Instant Loading - No Wait!
    </div>

    <!-- Controls info -->
    <div class="controls-info">
        <div><strong>🖱️ Drag:</strong> Rotate model</div>
        <div><strong>🔍 Scroll:</strong> Zoom in/out</div>
        <div><strong>📱 Touch:</strong> Rotate & pinch zoom</div>
    </div>

    <!-- Watermark -->
    <div class="watermark">
        Harsha's Instant 3D Human
    </div>

    <script>
        class InstantRealistic3DHuman {
            constructor() {
                this.container = document.getElementById('humanContainer');
                this.model = document.getElementById('humanModel');
                this.isDragging = false;
                this.startX = 0;
                this.startY = 0;
                this.rotationY = 0;
                this.rotationX = 0;
                this.currentScale = 1;

                this.setupControls();
                this.addIdleAnimation();
            }

            setupControls() {
                // Mouse events
                this.container.addEventListener('mousedown', (e) => {
                    this.isDragging = true;
                    this.startX = e.clientX;
                    this.startY = e.clientY;
                });

                document.addEventListener('mousemove', (e) => {
                    if (!this.isDragging) return;

                    const deltaX = e.clientX - this.startX;
                    const deltaY = e.clientY - this.startY;

                    this.rotationY += deltaX * 0.6;
                    this.rotationX -= deltaY * 0.4;

                    // Limit vertical rotation for realism
                    this.rotationX = Math.max(-25, Math.min(25, this.rotationX));

                    this.updateTransform();

                    this.startX = e.clientX;
                    this.startY = e.clientY;
                });

                document.addEventListener('mouseup', () => {
                    this.isDragging = false;
                });

                // Touch events with enhanced sensitivity
                this.container.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    if (e.touches.length === 1) {
                        this.isDragging = true;
                        this.startX = e.touches[0].clientX;
                        this.startY = e.touches[0].clientY;
                    } else if (e.touches.length === 2) {
                        this.isDragging = false;
                        this.initialPinchDistance = this.getPinchDistance(e.touches);
                        this.initialScale = this.currentScale;
                    }
                });

                document.addEventListener('touchmove', (e) => {
                    e.preventDefault();
                    if (e.touches.length === 1 && this.isDragging) {
                        const deltaX = e.touches[0].clientX - this.startX;
                        const deltaY = e.touches[0].clientY - this.startY;

                        this.rotationY += deltaX * 0.8;
                        this.rotationX -= deltaY * 0.5;
                        this.rotationX = Math.max(-25, Math.min(25, this.rotationX));

                        this.updateTransform();

                        this.startX = e.touches[0].clientX;
                        this.startY = e.touches[0].clientY;
                    } else if (e.touches.length === 2) {
                        const currentDistance = this.getPinchDistance(e.touches);
                        const scaleRatio = currentDistance / this.initialPinchDistance;
                        this.currentScale = Math.max(0.5, Math.min(2, this.initialScale * scaleRatio));
                        this.updateTransform();
                    }
                });

                document.addEventListener('touchend', () => {
                    this.isDragging = false;
                });

                // Mouse wheel for zoom
                this.container.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const zoomDelta = e.deltaY > 0 ? -0.1 : 0.1;
                    this.currentScale = Math.max(0.5, Math.min(2, this.currentScale + zoomDelta));
                    this.updateTransform();
                });
            }

            getPinchDistance(touches) {
                const dx = touches[0].clientX - touches[1].clientX;
                const dy = touches[0].clientY - touches[1].clientY;
                return Math.sqrt(dx * dx + dy * dy);
            }

            updateTransform() {
                this.model.style.transform = `
                    rotateY(${this.rotationY}deg)
                    rotateX(${this.rotationX}deg)
                    scale(${this.currentScale})
                `;
            }

            addIdleAnimation() {
                // Subtle idle movement
                setInterval(() => {
                    if (!this.isDragging) {
                        const time = Date.now() * 0.0002;
                        const subtleRotation = Math.sin(time) * 0.5;
                        this.model.style.transform += ` rotateZ(${subtleRotation}deg)`;
                    }
                }, 50);
            }
        }

        // Initialize immediately - no loading, no external dependencies!
        document.addEventListener('DOMContentLoaded', () => {
            new InstantRealistic3DHuman();
        });
    </script>
</body>
</html>
