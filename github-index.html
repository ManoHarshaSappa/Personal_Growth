<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMPL-X Inspired 3D Human Model</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: linear-gradient(135deg, #1a1a2e 0%, #16213e 50%, #0f3460 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        #canvas3d {
            width: 100vw;
            height: 100vh;
            display: block;
            cursor: grab;
        }

        #canvas3d:active {
            cursor: grabbing;
        }

        .loading {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            display: flex;
            flex-direction: column;
            align-items: center;
            color: #ecf0f1;
            z-index: 10;
            text-align: center;
        }

        .spinner {
            width: 60px;
            height: 60px;
            border: 4px solid rgba(236, 240, 241, 0.1);
            border-top: 4px solid #e74c3c;
            border-radius: 50%;
            animation: spin 1s linear infinite;
            margin-bottom: 20px;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .loading h2 {
            font-size: 22px;
            font-weight: 600;
            margin-bottom: 8px;
            letter-spacing: 1px;
            color: #e74c3c;
        }

        .loading p {
            font-size: 14px;
            opacity: 0.8;
            font-weight: 300;
        }

        .loading.hidden {
            display: none;
        }

        .controls-info {
            position: absolute;
            bottom: 30px;
            left: 30px;
            background: rgba(26, 26, 46, 0.95);
            color: #ecf0f1;
            padding: 18px 22px;
            border-radius: 15px;
            font-size: 14px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(231, 76, 60, 0.3);
            opacity: 0.9;
            transition: all 0.3s ease;
        }

        .controls-info:hover {
            opacity: 1;
            transform: translateY(-3px);
            border-color: rgba(231, 76, 60, 0.6);
        }

        .controls-info div {
            margin-bottom: 8px;
            display: flex;
            align-items: center;
        }

        .controls-info div:last-child {
            margin-bottom: 0;
        }

        .parameter-panel {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(26, 26, 46, 0.95);
            color: #ecf0f1;
            padding: 20px;
            border-radius: 15px;
            backdrop-filter: blur(20px);
            border: 1px solid rgba(231, 76, 60, 0.3);
            min-width: 280px;
            max-height: 80vh;
            overflow-y: auto;
        }

        .parameter-panel h3 {
            color: #e74c3c;
            margin-bottom: 15px;
            font-size: 16px;
            text-align: center;
            letter-spacing: 1px;
        }

        .param-group {
            margin-bottom: 20px;
        }

        .param-group h4 {
            color: #bdc3c7;
            font-size: 13px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
        }

        .param-slider {
            margin-bottom: 12px;
        }

        .param-slider label {
            display: block;
            font-size: 12px;
            margin-bottom: 5px;
            color: #95a5a6;
        }

        .param-slider input[type="range"] {
            width: 100%;
            height: 6px;
            border-radius: 3px;
            background: rgba(52, 73, 94, 0.8);
            outline: none;
            -webkit-appearance: none;
        }

        .param-slider input[type="range"]::-webkit-slider-thumb {
            appearance: none;
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #e74c3c;
            cursor: pointer;
            border: 2px solid #c0392b;
        }

        .param-slider input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            border-radius: 50%;
            background: #e74c3c;
            cursor: pointer;
            border: 2px solid #c0392b;
        }

        .watermark {
            position: absolute;
            bottom: 30px;
            right: 30px;
            color: rgba(236, 240, 241, 0.6);
            font-size: 11px;
            font-weight: 300;
            letter-spacing: 0.5px;
        }

        .smplx-badge {
            position: absolute;
            top: 30px;
            left: 30px;
            background: linear-gradient(135deg, #e74c3c 0%, #c0392b 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 25px;
            font-size: 13px;
            font-weight: 700;
            text-transform: uppercase;
            letter-spacing: 1px;
            backdrop-filter: blur(10px);
            animation: fadeIn 0.5s ease;
            box-shadow: 0 6px 20px rgba(231, 76, 60, 0.4);
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>
<body>
    <!-- Loading indicator -->
    <div id="loading" class="loading">
        <div class="spinner"></div>
        <h2>Loading SMPL-X Model</h2>
        <p>Generating parametric human mesh...</p>
    </div>

    <!-- 3D Canvas -->
    <canvas id="canvas3d"></canvas>

    <!-- SMPL-X Badge -->
    <div class="smplx-badge">
        🔬 SMPL-X Inspired Model
    </div>

    <!-- Parameter Controls -->
    <div class="parameter-panel" id="parameterPanel">
        <h3>Body Parameters</h3>

        <div class="param-group">
            <h4>Shape (Beta)</h4>
            <div class="param-slider">
                <label>Height</label>
                <input type="range" id="beta0" min="-3" max="3" step="0.1" value="0">
            </div>
            <div class="param-slider">
                <label>Weight</label>
                <input type="range" id="beta1" min="-3" max="3" step="0.1" value="0">
            </div>
            <div class="param-slider">
                <label>Chest</label>
                <input type="range" id="beta2" min="-3" max="3" step="0.1" value="0">
            </div>
        </div>

        <div class="param-group">
            <h4>Pose (Theta)</h4>
            <div class="param-slider">
                <label>Left Arm</label>
                <input type="range" id="pose_left_arm" min="-90" max="90" step="5" value="0">
            </div>
            <div class="param-slider">
                <label>Right Arm</label>
                <input type="range" id="pose_right_arm" min="-90" max="90" step="5" value="0">
            </div>
            <div class="param-slider">
                <label>Left Leg</label>
                <input type="range" id="pose_left_leg" min="-30" max="30" step="5" value="0">
            </div>
            <div class="param-slider">
                <label>Right Leg</label>
                <input type="range" id="pose_right_leg" min="-30" max="30" step="5" value="0">
            </div>
        </div>
    </div>

    <!-- Controls info -->
    <div class="controls-info">
        <div><strong>🖱️ Mouse:</strong> Rotate & zoom</div>
        <div><strong>📱 Touch:</strong> Rotate & pinch</div>
        <div><strong>🎛️ Sliders:</strong> Adjust body</div>
    </div>

    <!-- Watermark -->
    <div class="watermark">
        SMPL-X Inspired Human Model by Harsha
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r160/three.min.js"></script>
    <script>
        class SMPLXInspiredHuman {
            constructor() {
                this.scene = null;
                this.camera = null;
                this.renderer = null;
                this.canvas = null;
                this.humanMesh = null;

                // SMPL-X inspired parameters
                this.shapeParams = {
                    beta0: 0, // height
                    beta1: 0, // weight
                    beta2: 0, // chest
                };

                this.poseParams = {
                    left_arm: 0,
                    right_arm: 0,
                    left_leg: 0,
                    right_leg: 0
                };

                this.skinColor = new THREE.Color('#8b5c3c');
                this.init();
            }

            async init() {
                try {
                    this.setupScene();
                    this.createParametricHuman();
                    this.setupLighting();
                    this.setupControls();
                    this.setupParameterControls();
                    this.animate();
                    this.hideLoading();
                } catch (error) {
                    console.error('Failed to initialize SMPL-X model:', error);
                    this.hideLoading();
                }
            }

            setupScene() {
                this.canvas = document.getElementById('canvas3d');
                this.scene = new THREE.Scene();
                this.scene.background = new THREE.Color(0x1a1a2e);

                this.camera = new THREE.PerspectiveCamera(
                    50,
                    window.innerWidth / window.innerHeight,
                    0.1,
                    1000
                );
                this.camera.position.set(0, 1.7, 4);

                this.renderer = new THREE.WebGLRenderer({
                    canvas: this.canvas,
                    antialias: true,
                    alpha: true
                });
                this.renderer.setSize(window.innerWidth, window.innerHeight);
                this.renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
                this.renderer.shadowMap.enabled = true;
                this.renderer.shadowMap.type = THREE.PCFSoftShadowMap;
                this.renderer.outputColorSpace = THREE.SRGBColorSpace;
                this.renderer.toneMapping = THREE.ACESFilmicToneMapping;

                window.addEventListener('resize', () => this.handleResize());
            }

            setupLighting() {
                // Advanced lighting setup inspired by professional 3D rendering
                const ambientLight = new THREE.AmbientLight(0x404040, 0.4);
                this.scene.add(ambientLight);

                // Key light
                const keyLight = new THREE.DirectionalLight(0xffffff, 1.0);
                keyLight.position.set(3, 5, 4);
                keyLight.castShadow = true;
                keyLight.shadow.mapSize.width = 2048;
                keyLight.shadow.mapSize.height = 2048;
                this.scene.add(keyLight);

                // Fill light
                const fillLight = new THREE.DirectionalLight(0x87ceeb, 0.5);
                fillLight.position.set(-3, 3, -2);
                this.scene.add(fillLight);

                // Rim light
                const rimLight = new THREE.DirectionalLight(0xe74c3c, 0.3);
                rimLight.position.set(0, 2, -4);
                this.scene.add(rimLight);

                // Environment lighting
                const hemiLight = new THREE.HemisphereLight(0x87CEEB, 0x2c3e50, 0.3);
                this.scene.add(hemiLight);
            }

            createParametricHuman() {
                // Create a detailed mesh inspired by SMPL-X topology
                const humanGroup = new THREE.Group();

                // Advanced skin material
                const skinMaterial = new THREE.MeshPhysicalMaterial({
                    color: this.skinColor,
                    roughness: 0.4,
                    metalness: 0.0,
                    clearcoat: 0.2,
                    clearcoatRoughness: 0.1,
                    sheen: 0.5,
                    sheenRoughness: 0.3,
                    sheenColor: this.skinColor.clone().multiplyScalar(0.3),
                });

                // Create body parts with higher vertex count
                this.createDetailedBodyParts(humanGroup, skinMaterial);

                this.humanMesh = humanGroup;
                this.scene.add(humanGroup);

                // Add environment
                this.createEnvironment();
            }

            createDetailedBodyParts(group, material) {
                // Head with more detailed geometry
                const headGeometry = new THREE.SphereGeometry(0.13, 32, 24);
                headGeometry.scale(1, 1.2, 0.9);
                const head = new THREE.Mesh(headGeometry, material);
                head.position.y = 1.75;
                head.castShadow = true;
                head.receiveShadow = true;
                head.name = 'head';
                group.add(head);

                // Neck
                const neckGeometry = new THREE.CylinderGeometry(0.055, 0.07, 0.15, 16);
                const neck = new THREE.Mesh(neckGeometry, material);
                neck.position.y = 1.6;
                neck.castShadow = true;
                neck.receiveShadow = true;
                neck.name = 'neck';
                group.add(neck);

                // Torso with detailed shape
                const torsoGeometry = new THREE.CapsuleGeometry(0.18, 0.5, 16, 32);
                torsoGeometry.scale(1.4, 1, 1.2);
                const torso = new THREE.Mesh(torsoGeometry, material);
                torso.position.y = 1.3;
                torso.castShadow = true;
                torso.receiveShadow = true;
                torso.name = 'torso';
                group.add(torso);

                // Abdomen
                const abdomenGeometry = new THREE.CapsuleGeometry(0.15, 0.3, 12, 24);
                abdomenGeometry.scale(1.3, 1, 1.1);
                const abdomen = new THREE.Mesh(abdomenGeometry, material);
                abdomen.position.y = 0.9;
                abdomen.castShadow = true;
                abdomen.receiveShadow = true;
                abdomen.name = 'abdomen';
                group.add(abdomen);

                // Pelvis
                const pelvisGeometry = new THREE.CapsuleGeometry(0.16, 0.2, 12, 20);
                pelvisGeometry.scale(1.2, 1, 1.3);
                const pelvis = new THREE.Mesh(pelvisGeometry, material);
                pelvis.position.y = 0.7;
                pelvis.castShadow = true;
                pelvis.receiveShadow = true;
                pelvis.name = 'pelvis';
                group.add(pelvis);

                // Arms
                this.createDetailedLimbs(group, material);

                // Store references for parameter modification
                this.bodyParts = {
                    head, neck, torso, abdomen, pelvis
                };
            }

            createDetailedLimbs(group, material) {
                // Left upper arm
                const upperArmGeometry = new THREE.CapsuleGeometry(0.05, 0.3, 12, 20);
                const leftUpperArm = new THREE.Mesh(upperArmGeometry, material);
                leftUpperArm.position.set(-0.3, 1.4, 0);
                leftUpperArm.rotation.z = 0.2;
                leftUpperArm.castShadow = true;
                leftUpperArm.receiveShadow = true;
                leftUpperArm.name = 'left_upper_arm';
                group.add(leftUpperArm);

                // Right upper arm
                const rightUpperArm = new THREE.Mesh(upperArmGeometry, material);
                rightUpperArm.position.set(0.3, 1.4, 0);
                rightUpperArm.rotation.z = -0.2;
                rightUpperArm.castShadow = true;
                rightUpperArm.receiveShadow = true;
                rightUpperArm.name = 'right_upper_arm';
                group.add(rightUpperArm);

                // Left forearm
                const forearmGeometry = new THREE.CapsuleGeometry(0.04, 0.27, 12, 18);
                const leftForearm = new THREE.Mesh(forearmGeometry, material);
                leftForearm.position.set(-0.4, 1.08, 0.05);
                leftForearm.rotation.z = 0.1;
                leftForearm.castShadow = true;
                leftForearm.receiveShadow = true;
                leftForearm.name = 'left_forearm';
                group.add(leftForearm);

                // Right forearm
                const rightForearm = new THREE.Mesh(forearmGeometry, material);
                rightForearm.position.set(0.4, 1.08, 0.05);
                rightForearm.rotation.z = -0.1;
                rightForearm.castShadow = true;
                rightForearm.receiveShadow = true;
                rightForearm.name = 'right_forearm';
                group.add(rightForearm);

                // Hands with detailed fingers
                this.createDetailedHands(group, material);

                // Legs
                this.createDetailedLegs(group, material);

                // Store limb references
                Object.assign(this.bodyParts, {
                    leftUpperArm, rightUpperArm,
                    leftForearm, rightForearm
                });
            }

            createDetailedHands(group, material) {
                // Left hand palm
                const handGeometry = new THREE.CapsuleGeometry(0.035, 0.1, 10, 16);
                handGeometry.scale(1.4, 1, 0.8);
                const leftHand = new THREE.Mesh(handGeometry, material);
                leftHand.position.set(-0.43, 0.88, 0.1);
                leftHand.castShadow = true;
                leftHand.receiveShadow = true;
                group.add(leftHand);

                // Right hand palm
                const rightHand = new THREE.Mesh(handGeometry, material);
                rightHand.position.set(0.43, 0.88, 0.1);
                rightHand.castShadow = true;
                rightHand.receiveShadow = true;
                group.add(rightHand);

                // Add detailed fingers
                this.createFingers(group, material, 'left', -0.43, 0.88, 0.1);
                this.createFingers(group, material, 'right', 0.43, 0.88, 0.1);
            }

            createFingers(group, material, hand, x, y, z) {
                const fingerGeometry = new THREE.CapsuleGeometry(0.008, 0.04, 6, 8);

                const fingers = ['thumb', 'index', 'middle', 'ring', 'pinky'];
                const fingerLengths = [0.035, 0.045, 0.05, 0.043, 0.035];
                const fingerPositions = hand === 'left' ?
                    [-0.02, -0.01, 0, 0.01, 0.02] :
                    [0.02, 0.01, 0, -0.01, -0.02];

                fingers.forEach((fingerName, index) => {
                    const fingerGeom = fingerGeometry.clone();
                    fingerGeom.scale(1, fingerLengths[index] / 0.04, 1);

                    const finger = new THREE.Mesh(fingerGeom, material);
                    finger.position.set(
                        x + fingerPositions[index],
                        y - 0.06,
                        z + (fingerName === 'thumb' ? 0.02 : 0.03)
                    );

                    if (fingerName === 'thumb') {
                        finger.rotation.z = hand === 'left' ? 0.5 : -0.5;
                    }

                    finger.castShadow = true;
                    finger.receiveShadow = true;
                    group.add(finger);
                });
            }

            createDetailedLegs(group, material) {
                // Thighs
                const thighGeometry = new THREE.CapsuleGeometry(0.08, 0.42, 16, 24);
                const leftThigh = new THREE.Mesh(thighGeometry, material);
                leftThigh.position.set(-0.1, 0.4, 0);
                leftThigh.castShadow = true;
                leftThigh.receiveShadow = true;
                leftThigh.name = 'left_thigh';
                group.add(leftThigh);

                const rightThigh = new THREE.Mesh(thighGeometry, material);
                rightThigh.position.set(0.1, 0.4, 0);
                rightThigh.castShadow = true;
                rightThigh.receiveShadow = true;
                rightThigh.name = 'right_thigh';
                group.add(rightThigh);

                // Calves
                const calfGeometry = new THREE.CapsuleGeometry(0.05, 0.38, 14, 20);
                const leftCalf = new THREE.Mesh(calfGeometry, material);
                leftCalf.position.set(-0.1, 0.05, 0);
                leftCalf.castShadow = true;
                leftCalf.receiveShadow = true;
                leftCalf.name = 'left_calf';
                group.add(leftCalf);

                const rightCalf = new THREE.Mesh(calfGeometry, material);
                rightCalf.position.set(0.1, 0.05, 0);
                rightCalf.castShadow = true;
                rightCalf.receiveShadow = true;
                rightCalf.name = 'right_calf';
                group.add(rightCalf);

                // Feet
                const footGeometry = new THREE.CapsuleGeometry(0.04, 0.1, 10, 16);
                footGeometry.scale(1, 0.7, 2.5);
                const leftFoot = new THREE.Mesh(footGeometry, material);
                leftFoot.position.set(-0.1, -0.15, 0.06);
                leftFoot.castShadow = true;
                leftFoot.receiveShadow = true;
                group.add(leftFoot);

                const rightFoot = new THREE.Mesh(footGeometry, material);
                rightFoot.position.set(0.1, -0.15, 0.06);
                rightFoot.castShadow = true;
                rightFoot.receiveShadow = true;
                group.add(rightFoot);

                // Store leg references
                Object.assign(this.bodyParts, {
                    leftThigh, rightThigh,
                    leftCalf, rightCalf
                });
            }

            createEnvironment() {
                // Floor
                const floorGeometry = new THREE.CircleGeometry(10, 64);
                const floorMaterial = new THREE.MeshLambertMaterial({
                    color: 0x2c3e50,
                    transparent: true,
                    opacity: 0.3
                });
                const floor = new THREE.Mesh(floorGeometry, floorMaterial);
                floor.rotation.x = -Math.PI / 2;
                floor.position.y = -0.01;
                floor.receiveShadow = true;
                this.scene.add(floor);
            }

            setupControls() {
                let isMouseDown = false;
                let mouseX = 0;
                let mouseY = 0;
                this.targetRotationY = 0;
                this.targetRotationX = 0;
                this.currentZoom = 4;

                // Mouse controls
                this.canvas.addEventListener('mousedown', (event) => {
                    isMouseDown = true;
                    mouseX = event.clientX;
                    mouseY = event.clientY;
                });

                this.canvas.addEventListener('mousemove', (event) => {
                    if (!isMouseDown) return;

                    const deltaX = event.clientX - mouseX;
                    const deltaY = event.clientY - mouseY;

                    this.targetRotationY += deltaX * 0.01;
                    this.targetRotationX += deltaY * 0.01;
                    this.targetRotationX = Math.max(-Math.PI/4, Math.min(Math.PI/4, this.targetRotationX));

                    mouseX = event.clientX;
                    mouseY = event.clientY;
                });

                this.canvas.addEventListener('mouseup', () => {
                    isMouseDown = false;
                });

                this.canvas.addEventListener('mouseleave', () => {
                    isMouseDown = false;
                });

                // Zoom
                this.canvas.addEventListener('wheel', (event) => {
                    event.preventDefault();
                    const zoomDelta = event.deltaY * 0.002;
                    this.currentZoom += zoomDelta;
                    this.currentZoom = Math.max(2.5, Math.min(8, this.currentZoom));
                    this.camera.position.z = this.currentZoom;
                });

                // Touch controls
                this.setupTouchControls();
            }

            setupTouchControls() {
                let touchStartX = 0;
                let touchStartY = 0;
                let isTouching = false;

                this.canvas.addEventListener('touchstart', (event) => {
                    event.preventDefault();
                    isTouching = true;
                    const touch = event.touches[0];
                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                });

                this.canvas.addEventListener('touchmove', (event) => {
                    event.preventDefault();
                    if (!isTouching) return;

                    const touch = event.touches[0];
                    const deltaX = touch.clientX - touchStartX;
                    const deltaY = touch.clientY - touchStartY;

                    this.targetRotationY += deltaX * 0.015;
                    this.targetRotationX += deltaY * 0.015;
                    this.targetRotationX = Math.max(-Math.PI/4, Math.min(Math.PI/4, this.targetRotationX));

                    touchStartX = touch.clientX;
                    touchStartY = touch.clientY;
                });

                this.canvas.addEventListener('touchend', () => {
                    isTouching = false;
                });
            }

            setupParameterControls() {
                // Shape parameters
                document.getElementById('beta0').addEventListener('input', (e) => {
                    this.shapeParams.beta0 = parseFloat(e.target.value);
                    this.updateBodyShape();
                });

                document.getElementById('beta1').addEventListener('input', (e) => {
                    this.shapeParams.beta1 = parseFloat(e.target.value);
                    this.updateBodyShape();
                });

                document.getElementById('beta2').addEventListener('input', (e) => {
                    this.shapeParams.beta2 = parseFloat(e.target.value);
                    this.updateBodyShape();
                });

                // Pose parameters
                document.getElementById('pose_left_arm').addEventListener('input', (e) => {
                    this.poseParams.left_arm = parseFloat(e.target.value);
                    this.updateBodyPose();
                });

                document.getElementById('pose_right_arm').addEventListener('input', (e) => {
                    this.poseParams.right_arm = parseFloat(e.target.value);
                    this.updateBodyPose();
                });

                document.getElementById('pose_left_leg').addEventListener('input', (e) => {
                    this.poseParams.left_leg = parseFloat(e.target.value);
                    this.updateBodyPose();
                });

                document.getElementById('pose_right_leg').addEventListener('input', (e) => {
                    this.poseParams.right_leg = parseFloat(e.target.value);
                    this.updateBodyPose();
                });
            }

            updateBodyShape() {
                if (!this.bodyParts) return;

                // Apply shape deformations inspired by SMPL-X beta parameters
                const { beta0, beta1, beta2 } = this.shapeParams;

                // Height adjustment
                const heightScale = 1 + beta0 * 0.1;
                this.humanMesh.scale.y = heightScale;

                // Weight adjustment
                const weightScale = 1 + beta1 * 0.15;
                if (this.bodyParts.torso) {
                    this.bodyParts.torso.scale.x = weightScale;
                    this.bodyParts.torso.scale.z = weightScale;
                }
                if (this.bodyParts.abdomen) {
                    this.bodyParts.abdomen.scale.x = weightScale;
                    this.bodyParts.abdomen.scale.z = weightScale;
                }

                // Chest adjustment
                const chestScale = 1 + beta2 * 0.2;
                if (this.bodyParts.torso) {
                    this.bodyParts.torso.scale.x = weightScale * chestScale;
                }
            }

            updateBodyPose() {
                if (!this.bodyParts) return;

                const { left_arm, right_arm, left_leg, right_leg } = this.poseParams;

                // Apply pose deformations
                if (this.bodyParts.leftUpperArm) {
                    this.bodyParts.leftUpperArm.rotation.z = 0.2 + (left_arm * Math.PI) / 180;
                }
                if (this.bodyParts.rightUpperArm) {
                    this.bodyParts.rightUpperArm.rotation.z = -0.2 + (right_arm * Math.PI) / 180;
                }
                if (this.bodyParts.leftThigh) {
                    this.bodyParts.leftThigh.rotation.z = (left_leg * Math.PI) / 180;
                }
                if (this.bodyParts.rightThigh) {
                    this.bodyParts.rightThigh.rotation.z = (right_leg * Math.PI) / 180;
                }
            }

            animate() {
                requestAnimationFrame(() => this.animate());

                // Smooth rotation
                if (this.humanMesh) {
                    this.humanMesh.rotation.y += (this.targetRotationY - this.humanMesh.rotation.y) * 0.1;
                    this.humanMesh.rotation.x += (this.targetRotationX - this.humanMesh.rotation.x) * 0.1;

                    // Subtle breathing
                    const time = Date.now() * 0.0005;
                    if (this.bodyParts.torso) {
                        this.bodyParts.torso.scale.z = (1 + this.shapeParams.beta1 * 0.15) * (1 + Math.sin(time) * 0.02);
                    }
                }

                this.renderer.render(this.scene, this.camera);
            }

            handleResize() {
                const width = window.innerWidth;
                const height = window.innerHeight;

                this.camera.aspect = width / height;
                this.camera.updateProjectionMatrix();
                this.renderer.setSize(width, height);
            }

            hideLoading() {
                const loading = document.getElementById('loading');
                loading.classList.add('hidden');
            }
        }

        // Initialize the SMPL-X inspired model
        document.addEventListener('DOMContentLoaded', () => {
            new SMPLXInspiredHuman();
        });
    </script>
</body>
</html>
