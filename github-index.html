<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Harsha's 3D Human</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body, html {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background: #f0f0f0;
            font-family: Arial, sans-serif;
        }

        .human-container {
            width: 100vw;
            height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            cursor: grab;
            perspective: 1000px;
        }

        .human-container:active {
            cursor: grabbing;
        }

        .human-model {
            transform-style: preserve-3d;
            transition: transform 0.1s ease;
        }

        .body-part {
            position: absolute;
            background: #7a4825; /* Your skin tone */
            border-radius: 8px;
            transform-style: preserve-3d;
        }

        /* Head */
        .head {
            width: 80px;
            height: 80px;
            border-radius: 50%;
            top: -40px;
            left: -40px;
            box-shadow: inset -10px -10px 20px rgba(0,0,0,0.1);
        }

        /* Neck */
        .neck {
            width: 30px;
            height: 50px;
            top: 40px;
            left: -15px;
            border-radius: 15px;
        }

        /* Torso */
        .torso {
            width: 120px;
            height: 180px;
            top: 90px;
            left: -60px;
            border-radius: 20px;
            box-shadow: inset -15px -15px 30px rgba(0,0,0,0.1);
        }

        /* Arms */
        .arm-left, .arm-right {
            width: 25px;
            height: 120px;
            top: 100px;
            border-radius: 12px;
        }

        .arm-left {
            left: -100px;
            transform: rotate(15deg);
        }

        .arm-right {
            right: -100px;
            transform: rotate(-15deg);
        }

        /* Forearms */
        .forearm-left, .forearm-right {
            width: 22px;
            height: 100px;
            top: 210px;
            border-radius: 11px;
        }

        .forearm-left {
            left: -95px;
            transform: rotate(10deg);
        }

        .forearm-right {
            right: -95px;
            transform: rotate(-10deg);
        }

        /* Hands */
        .hand-left, .hand-right {
            width: 30px;
            height: 40px;
            top: 305px;
            border-radius: 15px;
        }

        .hand-left {
            left: -105px;
        }

        .hand-right {
            right: -105px;
        }

        /* Pelvis */
        .pelvis {
            width: 100px;
            height: 80px;
            top: 270px;
            left: -50px;
            border-radius: 15px;
        }

        /* Legs */
        .leg-left, .leg-right {
            width: 35px;
            height: 150px;
            top: 350px;
            border-radius: 17px;
        }

        .leg-left {
            left: -55px;
        }

        .leg-right {
            right: -55px;
        }

        /* Calves */
        .calf-left, .calf-right {
            width: 30px;
            height: 130px;
            top: 500px;
            border-radius: 15px;
        }

        .calf-left {
            left: -50px;
        }

        .calf-right {
            right: -50px;
        }

        /* Feet */
        .foot-left, .foot-right {
            width: 60px;
            height: 25px;
            top: 630px;
            border-radius: 12px;
        }

        .foot-left {
            left: -65px;
        }

        .foot-right {
            right: -65px;
        }

        /* Breathing animation */
        @keyframes breathe {
            0%, 100% { transform: scale(1); }
            50% { transform: scale(1.02); }
        }

        .torso {
            animation: breathe 3s ease-in-out infinite;
        }

        /* Hide scrollbars */
        body::-webkit-scrollbar {
            display: none;
        }

        body {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }
    </style>
</head>
<body>
    <div class="human-container" id="humanContainer">
        <div class="human-model" id="humanModel">
            <!-- Head -->
            <div class="body-part head"></div>

            <!-- Neck -->
            <div class="body-part neck"></div>

            <!-- Torso -->
            <div class="body-part torso"></div>

            <!-- Arms -->
            <div class="body-part arm-left"></div>
            <div class="body-part arm-right"></div>

            <!-- Forearms -->
            <div class="body-part forearm-left"></div>
            <div class="body-part forearm-right"></div>

            <!-- Hands -->
            <div class="body-part hand-left"></div>
            <div class="body-part hand-right"></div>

            <!-- Pelvis -->
            <div class="body-part pelvis"></div>

            <!-- Legs -->
            <div class="body-part leg-left"></div>
            <div class="body-part leg-right"></div>

            <!-- Calves -->
            <div class="body-part calf-left"></div>
            <div class="body-part calf-right"></div>

            <!-- Feet -->
            <div class="body-part foot-left"></div>
            <div class="body-part foot-right"></div>
        </div>
    </div>

    <script>
        class InstantHuman {
            constructor() {
                this.container = document.getElementById('humanContainer');
                this.model = document.getElementById('humanModel');
                this.isDragging = false;
                this.startX = 0;
                this.startY = 0;
                this.rotationY = 0;
                this.rotationX = 0;

                this.setupControls();
            }

            setupControls() {
                // Mouse events
                this.container.addEventListener('mousedown', (e) => {
                    this.isDragging = true;
                    this.startX = e.clientX;
                    this.startY = e.clientY;
                });

                document.addEventListener('mousemove', (e) => {
                    if (!this.isDragging) return;

                    const deltaX = e.clientX - this.startX;
                    const deltaY = e.clientY - this.startY;

                    this.rotationY += deltaX * 0.5;
                    this.rotationX -= deltaY * 0.3;

                    // Limit vertical rotation
                    this.rotationX = Math.max(-30, Math.min(30, this.rotationX));

                    this.updateRotation();

                    this.startX = e.clientX;
                    this.startY = e.clientY;
                });

                document.addEventListener('mouseup', () => {
                    this.isDragging = false;
                });

                // Touch events
                this.container.addEventListener('touchstart', (e) => {
                    e.preventDefault();
                    this.isDragging = true;
                    this.startX = e.touches[0].clientX;
                    this.startY = e.touches[0].clientY;
                });

                document.addEventListener('touchmove', (e) => {
                    if (!this.isDragging) return;
                    e.preventDefault();

                    const deltaX = e.touches[0].clientX - this.startX;
                    const deltaY = e.touches[0].clientY - this.startY;

                    this.rotationY += deltaX * 0.5;
                    this.rotationX -= deltaY * 0.3;

                    this.rotationX = Math.max(-30, Math.min(30, this.rotationX));

                    this.updateRotation();

                    this.startX = e.touches[0].clientX;
                    this.startY = e.touches[0].clientY;
                });

                document.addEventListener('touchend', () => {
                    this.isDragging = false;
                });

                // Zoom with mouse wheel
                this.container.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const currentScale = this.getCurrentScale();
                    const newScale = currentScale + (e.deltaY > 0 ? -0.1 : 0.1);
                    const clampedScale = Math.max(0.5, Math.min(2, newScale));
                    this.setScale(clampedScale);
                });
            }

            updateRotation() {
                this.model.style.transform = `rotateY(${this.rotationY}deg) rotateX(${this.rotationX}deg)`;
            }

            getCurrentScale() {
                const transform = this.model.style.transform;
                const scaleMatch = transform.match(/scale\(([^)]+)\)/);
                return scaleMatch ? parseFloat(scaleMatch[1]) : 1;
            }

            setScale(scale) {
                const currentTransform = this.model.style.transform;
                const withoutScale = currentTransform.replace(/scale\([^)]+\)\s?/g, '');
                this.model.style.transform = `${withoutScale} scale(${scale})`;
            }
        }

        // Start immediately - no loading!
        new InstantHuman();
    </script>
</body>
</html>
